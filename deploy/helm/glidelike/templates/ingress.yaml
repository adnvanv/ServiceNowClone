{{- if .Values.ingress.enabled }}
# One entry point: /api -> backend, everything else -> the SPA. The longer
# prefix wins, so /api/now/... never reaches nginx.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "glidelike.fullname" . }}
  labels:
    {{- include "glidelike.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - {{- with .Values.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "glidelike.backend.fullname" . }}
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "glidelike.frontend.fullname" . }}
                port:
                  name: http
{{- end }}
