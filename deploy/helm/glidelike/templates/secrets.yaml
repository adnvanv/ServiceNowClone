{{- /*
Secrets are generated once and then preserved: `lookup` reads the live
Secret on upgrade, so `helm upgrade` never rotates the JWT key (which would
log everyone out) or the DB password (which would lock the app out of a
database initialised with the old one). `helm template` / dry-runs see no
cluster, so they render fresh random values — harmless.
*/ -}}
{{- if not .Values.secrets.existingSecret }}
{{- $name := include "glidelike.appSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $jwt := .Values.secrets.jwtSecret }}
{{- if not $jwt }}
{{- if and $existing $existing.data (hasKey $existing.data "PLATFORM_JWT_SECRET") }}
{{- $jwt = index $existing.data "PLATFORM_JWT_SECRET" | b64dec }}
{{- else }}
{{- $jwt = randAlphaNum 64 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "glidelike.labels" . | nindent 4 }}
type: Opaque
data:
  PLATFORM_JWT_SECRET: {{ $jwt | b64enc | quote }}
{{- end }}
{{- if not .Values.postgres.existingSecret }}
{{- $name := include "glidelike.dbSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $pw := .Values.postgres.password }}
{{- if not $pw }}
{{- if eq .Values.postgres.mode "external" }}
{{- fail "postgres.password (or postgres.existingSecret) is required when postgres.mode=external" }}
{{- end }}
{{- if and $existing $existing.data (hasKey $existing.data "password") }}
{{- $pw = index $existing.data "password" | b64dec }}
{{- else }}
{{- $pw = randAlphaNum 32 }}
{{- end }}
{{- end }}
---
# kubernetes.io/basic-auth is the shape CloudNativePG's bootstrap.initdb.secret
# expects, so the operator and the backend read the very same Secret.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "glidelike.labels" . | nindent 4 }}
type: kubernetes.io/basic-auth
data:
  username: {{ .Values.postgres.username | b64enc | quote }}
  password: {{ $pw | b64enc | quote }}
{{- end }}
