name: CI

# Every push proves three things without anything left running afterwards:
#   1. the code builds and its tests pass (unit + Testcontainers integration)
#   2. the images build and are published to GitHub Container Registry
#   3. the Helm chart actually deploys: a throwaway kind cluster is created in
#      the runner, the chart is installed from the just-pushed images, a smoke
#      test runs through the Ingress, and a backend pod is killed mid-traffic
#      with zero failed requests.
# Terraform is format-checked and validated (and planned, if AWS credentials
# are configured) but never applied from CI.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # GHCR image names must be lowercase.
  BACKEND_IMAGE: ghcr.io/adnvanv/servicenowclone-backend
  FRONTEND_IMAGE: ghcr.io/adnvanv/servicenowclone-frontend

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unit + Testcontainers integration tests
        working-directory: backend
        run: ./mvnw -B -ntp verify

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

  helm-lint:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint and render both database modes
        run: |
          helm lint deploy/helm/glidelike -f deploy/helm/glidelike/values-kind.yaml
          helm template t deploy/helm/glidelike > /dev/null
          helm template t deploy/helm/glidelike \
            --set postgres.mode=external \
            --set postgres.external.host=db.example.internal \
            --set postgres.password=ci-only > /dev/null

  images:
    name: Build + push images
    runs-on: ubuntu-latest
    needs: [backend, frontend, helm-lint]
    # Fork PRs get a read-only token and cannot push to this repo's registry.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest', env.BACKEND_IMAGE) || '' }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest', env.FRONTEND_IMAGE) || '' }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy-kind:
    name: Deploy to kind + smoke + chaos
    runs-on: ubuntu-latest
    needs: images
    permissions:
      contents: read
      packages: read
    env:
      TAG: ${{ needs.images.outputs.tag }}
      NAMESPACE: glidelike
      RELEASE: glidelike
      BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: glidelike
          config: deploy/kind/kind-config.yaml
          wait: 120s

      - name: Install Traefik, metrics-server, CloudNativePG operator
        run: make addons CLUSTER=glidelike

      - name: Registry pull secret
        # GHCR packages start private; let the cluster pull with this run's token.
        run: |
          kubectl create namespace "$NAMESPACE"
          kubectl -n "$NAMESPACE" create secret docker-registry ghcr \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GITHUB_TOKEN }}"

      - name: helm install (images from GHCR)
        run: |
          helm upgrade --install "$RELEASE" deploy/helm/glidelike \
            --namespace "$NAMESPACE" \
            --set backend.image.repository="$BACKEND_IMAGE" \
            --set backend.image.tag="$TAG" \
            --set frontend.image.repository="$FRONTEND_IMAGE" \
            --set frontend.image.tag="$TAG" \
            --set 'imagePullSecrets[0].name=ghcr' \
            --wait --timeout 10m
          kubectl -n "$NAMESPACE" rollout status "deploy/$RELEASE-backend" --timeout 5m
          kubectl -n "$NAMESPACE" rollout status "deploy/$RELEASE-frontend" --timeout 2m
          kubectl -n "$NAMESPACE" get pods,svc,ingress,hpa,pdb -o wide

      - name: Concurrent startup was safe (Flyway + seeder locks)
        run: |
          # All three replicas booted against an empty database at once.
          # Exactly one should have seeded; the others must have skipped.
          seeded=0; skipped=0
          for p in $(kubectl -n "$NAMESPACE" get pods -l app.kubernetes.io/component=backend -o name); do
            logs=$(kubectl -n "$NAMESPACE" logs "$p" --all-containers || true)
            echo "$logs" | grep -q "Demo data seeded" && seeded=$((seeded+1))
            echo "$logs" | grep -q "Demo data already present" && skipped=$((skipped+1))
          done
          echo "seeded=$seeded skipped=$skipped"
          test "$seeded" -le 1

      - name: Smoke test
        run: ./scripts/smoke-test.sh

      - name: Chaos test (delete a backend pod under load)
        run: ./scripts/chaos-test.sh

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl -n "$NAMESPACE" describe pods
          kubectl -n "$NAMESPACE" logs -l app.kubernetes.io/component=backend --all-containers --tail=200 --prefix

  terraform:
    name: Terraform fmt / validate / plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # for optional AWS OIDC login
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      # `plan` talks to AWS, so it only runs once a read-only role is configured
      # (repo variable AWS_PLAN_ROLE_ARN, trusted for this repo via GitHub OIDC).
      # It never applies — nothing is created and nothing costs money.
      - name: Configure AWS credentials (OIDC)
        if: vars.AWS_PLAN_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1
      - name: terraform plan
        if: vars.AWS_PLAN_ROLE_ARN != ''
        run: terraform plan -input=false -lock=false
